name: chat_game
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # state management & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  # Firebase: Auth only (Google sign-in + anonymous) — Firestore/Storage removed
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  google_sign_in: ^6.2.0
  # Backend REST + WebSocket
  flutter_secure_storage: ^4.2.0
  http: ^0.13.4
  web_socket_channel: ^3.0.0
  # UI / utilities
  cupertino_icons: ^1.0.6
  intl: ^0.17.0
  audioplayers: ^6.0.0
  image_picker: ^1.0.7
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/default_profile_image.png
    - assets/splash.png
    - assets/images/dashboardbackground.jpg
    - assets/sounds/ding.mp3
    - assets/images/logo.png
    - assets/images/google_logo.png
