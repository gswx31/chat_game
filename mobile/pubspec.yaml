name: chat_game
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # state management & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  # Firebase 완전 제거 — 게스트 인증은 device UUID 기반
  # Backend REST + WebSocket
  flutter_secure_storage: ^9.2.0
  http: ^1.2.2
  web_socket_channel: ^3.0.0
  # UI / utilities
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/default_profile_image.png
    - assets/splash.png
    - assets/images/dashboardbackground.jpg
    - assets/images/logo.png
    - assets/images/google_logo.png

# 런처 아이콘 생성: dart run flutter_launcher_icons
# (임시 아이콘 — assets/images/logo.png 를 그대로 사용. 정식 출시 전 교체 권장)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo.png
  adaptive_icon_background: "#E8527A"
  adaptive_icon_foreground: assets/images/logo.png
